      <path d="M52 16L57 21L69 8.5" stroke="#20a464" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="bg" x="96" y="-8" width="40" height="40" rx="9"/>
      <path d="M106 6C110 -1 118 -2 124 0C131 3 132 10 126 16L111 27H130" stroke="#d9f5df" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M132 3H116V14H129M116 14V27H132" stroke="#d9f5df" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M106 19L113 26L128 10" stroke="#20a464" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="tiny" x="72" y="50">24 / 32 / 40px</text>
    </g>
  </g>

  <!-- 4. Scan 2E -->
  <g transform="translate(898 135)">
    <rect class="card" width="250" height="360" rx="28"/>
    <rect class="bg" x="50" y="34" width="150" height="150" rx="34"/>
    <path class="green" d="M85 81H72V68H99V95H85V81ZM165 81H178V68H151V95H165V81ZM85 139H72V152H99V125H85V139ZM165 139H178V152H151V125H165V139Z"/>
    <path d="M91 89C98 75 115 70 130 75C144 80 149 93 143 106C140 114 132 120 121 127L103 139H145" stroke="#d9f5df" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M158 84H129V109H153M129 109V136H160" stroke="#d9f5df" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="125" y="230">Scan 2E</text>
    <text class="note" x="125" y="260">most functional</text>
    <g transform="translate(57 295)">
      <rect class="bg" width="24" height="24" rx="6"/>
      <path class="green" d="M6 7H3V4H9V10H6V7ZM18 7H21V4H15V10H18V7ZM6 17H3V20H9V14H6V17ZM18 17H21V20H15V14H18V17Z"/>
      <path d="M7 9C9 6 13 5 16 7C18 9 18 12 15 14L10 17H17" stroke="#d9f5df" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18 7H12V12H17M12 12V17H19" stroke="#d9f5df" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="bg" x="44" y="-4" width="32" height="32" rx="8"/>
      <path class="green" d="M52 7H48V3H57V12H52V7ZM68 7H72V3H63V12H68V7ZM52 21H48V25H57V16H52V21ZM68 21H72V25H63V16H68V21Z"/>
      <path d="M53 9C56 4 61 3 65 5C69 7 70 11 66 14L58 20H67" stroke="#d9f5df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M70 6H60V13H68M60 13V20H71" stroke="#d9f5df" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="bg" x="96" y="-8" width="40" height="40" rx="9"/>
      <path class="green" d="M106 6H101V1H112V12H106V6ZM126 6H131V1H120V12H126V6ZM106 26H101V31H112V20H106V26ZM126 26H131V31H120V20H126V26Z"/>
      <path d="M108 8C111 2 118 1 123 3C128 6 129 11 124 15L113 23H126" stroke="#d9f5df" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M129 4H116V12H126M116 12V23H130" stroke="#d9f5df" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="tiny" x="72" y="50">24 / 32 / 40px</text>
    </g>
  </g>

  <!-- 5. Bowl 2E -->
  <g transform="translate(1172 135)">
    <rect class="card" width="250" height="360" rx="28"/>
    <rect class="bg" x="50" y="34" width="150" height="150" rx="34"/>
    <path class="mint" d="M77 116C83 150 101 168 125 168C149 168 167 150 173 116H77Z"/>
    <path class="green" d="M85 94H165C173 94 180 101 180 109C180 117 173 124 165 124H85C77 124 70 117 70 109C70 101 77 94 85 94Z"/>
    <path d="M88 79C97 62 116 57 135 62C153 67 159 83 152 99C148 109 139 116 127 124L105 139H154" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M165 77H132V102H158M132 102V128H167" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="125" y="230">Bowl 2E</text>
    <text class="note" x="125" y="260">warmest food-first mark</text>
    <g transform="translate(57 295)">
      <rect class="bg" width="24" height="24" rx="6"/>
      <path class="mint" d="M4 13C5.5 21 9 24 12 24C15 24 18.5 21 20 13H4Z"/>
      <rect class="green" x="4" y="10" width="16" height="6" rx="3"/>
      <path d="M6 8C8 4 12 3 16 4C19 5 20 9 17 12L11 16H18" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19 7H13V12H18M13 12V17H20" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="bg" x="44" y="-4" width="32" height="32" rx="8"/>
      <path class="mint" d="M49 15C51 25 55 30 60 30C65 30 69 25 71 15H49Z"/>
      <rect class="green" x="49" y="10" width="22" height="8" rx="4"/>
      <path d="M52 8C55 3 61 2 65 4C69 6 70 11 66 14L58 20H68" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M70 6H60V13H68M60 13V21H71" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="bg" x="96" y="-8" width="40" height="40" rx="9"/>
      <path class="mint" d="M102 17C104 29 109 36 116 36C123 36 128 29 130 17H102Z"/>
      <rect class="green" x="101" y="10" width="30" height="10" rx="5"/>
      <path d="M106 8C110 1 118 0 123 3C128 6 129 12 124 16L113 25H127" stroke="#fff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M130 4H116V13H127M116 13V25H131" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="tiny" x="72" y="50">24 / 32 / 40px</text>
    </g>
  </g>

  <g transform="translate(100 580)">
    <rect class="card" width="1300" height="280" rx="30"/>
    <text x="650" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="950" fill="#1f2933">2E Works If We Keep It Bold</text>
    <text x="80" y="112" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" fill="#1f2933">Why it is better</text>
    <text x="80" y="142" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">It is ownable to the name. Plate/check/fork icons alone are too generic.</text>
    <text x="80" y="192" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" fill="#1f2933">Risk</text>
    <text x="80" y="222" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">If the E gets too detailed, it becomes hard to read below 32px.</text>
    <text x="820" y="112" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" fill="#1f2933">Best directions</text>
    <text x="820" y="150" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="950" fill="#20a464">Split 2E or Plate 2E</text>
    <text x="820" y="188" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">Split 2E is the strongest brand mark.</text>
    <text x="820" y="218" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">Plate 2E adds the clearest food context.</text>
  </g>
</svg>
