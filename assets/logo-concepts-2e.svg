      <path d="M52 8C55 4 60 3 64 5C68 7 69 11 66 14L58 20H67" stroke="#1f2933" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M70 5H60V12H68M60 12V20H71" stroke="#20a464" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="bg" x="96" y="-8" width="40" height="40" rx="9"/>
      <circle class="mint" cx="116" cy="12" r="12.5"/>
      <path d="M107 7C111 2 117 1 122 3C127 6 128 11 124 15L113 23H125" stroke="#1f2933" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M129 3H116V12H126M116 12V23H130" stroke="#20a464" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="tiny" x="72" y="50">24 / 32 / 40px</text>
    </g>
  </g>

