<svg width="1500" height="980" viewBox="0 0 1500 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">What 2 Eat 2E logo concepts</title>
  <desc id="desc">Five clean 2E monogram logo icon concepts for What 2 Eat.</desc>
  <rect width="1500" height="980" fill="#FBFAF6"/>
  <style>
    .card { fill: #fff; stroke: #dce3e8; stroke-width: 2; }
    .bg { fill: #1f2933; }
    .green { fill: #20a464; }
    .mint { fill: #d9f5df; }
    .ink { fill: #1f2933; }
    .label { font: 900 28px Inter, Arial, sans-serif; fill: #1f2933; text-anchor: middle; }
    .note { font: 650 17px Inter, Arial, sans-serif; fill: #65717f; text-anchor: middle; }
    .tiny { font: 800 12px Inter, Arial, sans-serif; fill: #65717f; text-anchor: middle; }
  </style>

  <text x="750" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="950" fill="#1f2933">2E Monogram Directions</text>
  <text x="750" y="91" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" fill="#65717f">A name-specific mark: compact enough for app icons, still tied to eating through shape, plate, scan, or check cues.</text>

  <!-- 1. Split 2E -->
  <g transform="translate(76 135)">
    <rect class="card" width="250" height="360" rx="28"/>
    <rect class="bg" x="50" y="34" width="150" height="150" rx="34"/>
    <path d="M78 80C87 62 107 55 129 61C149 66 157 84 150 101C146 113 135 122 121 131L96 147H153" stroke="#d9f5df" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M166 72H124V110H159M124 110V150H168" stroke="#20a464" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="125" y="230">Split 2E</text>
    <text class="note" x="125" y="260">clearest monogram</text>
    <g transform="translate(57 295)">
      <rect class="bg" width="24" height="24" rx="6"/>
      <path d="M5 8C7 4 11 3 15 4C19 5 20 9 18 12L10 18H19" stroke="#d9f5df" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 6H12V12H19M12 12V19H21" stroke="#20a464" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="bg" x="44" y="-4" width="32" height="32" rx="8"/>
      <path d="M51 7C54 1 60 0 65 2C70 4 72 9 68 14L56 22H70" stroke="#d9f5df" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M72 5H59V13H70M59 13V23H73" stroke="#20a464" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="bg" x="96" y="-8" width="40" height="40" rx="9"/>
      <path d="M105 6C109 -1 117 -2 123 0C130 3 132 10 126 16L111 27H130" stroke="#d9f5df" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M132 3H116V14H129M116 14V27H133" stroke="#20a464" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="tiny" x="72" y="50">24 / 32 / 40px</text>
    </g>
  </g>

  <!-- 2. Plate 2E -->
  <g transform="translate(350 135)">
    <rect class="card" width="250" height="360" rx="28"/>
    <rect class="bg" x="50" y="34" width="150" height="150" rx="34"/>
    <circle class="mint" cx="125" cy="109" r="48"/>
    <path d="M91 91C98 78 112 74 126 78C140 82 145 95 140 107C137 115 128 122 117 128L99 140H142" stroke="#1f2933" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M157 84H126V109H151M126 109V136H159" stroke="#20a464" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="125" y="230">Plate 2E</text>
    <text class="note" x="125" y="260">brand + food context</text>
    <g transform="translate(57 295)">
      <rect class="bg" width="24" height="24" rx="6"/>
      <circle class="mint" cx="12" cy="12" r="7.4"/>
      <path d="M7 9C9 7 12 6 14 7C17 8 17 11 15 13L10 17H16" stroke="#1f2933" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
