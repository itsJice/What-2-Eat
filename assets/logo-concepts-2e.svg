      <rect class="bg" x="44" y="-4" width="32" height="32" rx="8"/>
      <path d="M52 7C55 1 62 0 67 3C72 6 72 11 67 15L56 22H70" stroke="#d9f5df" stroke-width="3.9" stroke-linecap="round" stroke-linejoin="round"/>
