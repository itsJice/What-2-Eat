    <text class="label" x="125" y="230">Check 2E</text>
    <text class="note" x="125" y="260">name + compatibility</text>
    <g transform="translate(57 295)">
      <rect class="bg" width="24" height="24" rx="6"/>
      <path d="M6 8C8 4 12 3 16 4C20 5 21 9 18 12L10 18H19" stroke="#d9f5df" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
