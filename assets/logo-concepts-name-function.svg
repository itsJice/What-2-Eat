      <path d="M52 15L57 20L68 8.5" stroke="#20a464" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="bg" x="96" y="-8" width="40" height="40" rx="9"/>
      <path d="M106 6C110 -1 118 -2 124 0C131 3 132 10 126 15L111 26H129" stroke="#d9f5df" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M106 17L113 24L127 9" stroke="#20a464" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="tiny" x="72" y="50">24 / 32 / 40px</text>
    </g>
  </g>

