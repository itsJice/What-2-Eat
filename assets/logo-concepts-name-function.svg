    <text class="label" x="125" y="230">2 Choice</text>
    <text class="note" x="125" y="260">the name becomes the answer</text>
    <g transform="translate(57 295)">
      <rect class="bg" width="24" height="24" rx="6"/>
      <path d="M7 8C9 4 13 3 16 4C20 5 21 9 18 12L10 18H19" stroke="#d9f5df" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 13L10 17L18 8.5" stroke="#20a464" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="bg" x="44" y="-4" width="32" height="32" rx="8"/>
