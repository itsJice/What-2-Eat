  <g transform="translate(100 580)">
    <rect class="card" width="1300" height="280" rx="30"/>
    <text x="650" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="950" fill="#1f2933">Why These Fit Better</text>
    <text x="80" y="108" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" fill="#1f2933">Name fit</text>
    <text x="80" y="138" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">The “2” becomes the central symbol: the answer, the route, or the eating choice.</text>
    <text x="80" y="188" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" fill="#1f2933">Function fit</text>
    <text x="80" y="218" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">They reference scan, menu decision, order path, or safe choice instead of just generic food.</text>
    <text x="820" y="108" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" fill="#1f2933">Best direction</text>
    <text x="820" y="146" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="950" fill="#20a464">Scan 2 Eat</text>
    <text x="820" y="184" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">It connects the name and the core MVP action most clearly:</text>
    <text x="820" y="214" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">scan a menu, get the thing to eat.</text>
  </g>
</svg>
