<svg width="1500" height="980" viewBox="0 0 1500 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">What 2 Eat name and function logo concepts</title>
  <desc id="desc">Five logo icon concepts that connect the What 2 Eat name with menu scanning and confident food choice.</desc>
  <rect width="1500" height="980" fill="#FBFAF6"/>
  <style>
    .card { fill: #fff; stroke: #dce3e8; stroke-width: 2; }
    .bg { fill: #1f2933; }
    .green { fill: #20a464; }
    .mint { fill: #d9f5df; }
    .white { fill: #fff; }
    .ink { fill: #1f2933; }
    .label { font: 900 28px Inter, Arial, sans-serif; fill: #1f2933; text-anchor: middle; }
    .note { font: 650 17px Inter, Arial, sans-serif; fill: #65717f; text-anchor: middle; }
    .tiny { font: 800 12px Inter, Arial, sans-serif; fill: #65717f; text-anchor: middle; }
  </style>

  <text x="750" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="950" fill="#1f2933">More “What 2 Eat” + Product Function</text>
  <text x="750" y="91" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" fill="#65717f">These use the “2” as a choice path, scan result, or order decision without becoming text-heavy.</text>

  <!-- 1. The 2 Choice -->
