      <rect class="tile" x="52" y="-6" width="40" height="40" rx="9"/>
      <path class="green" d="M72 34S86 24 86 12C86 4 80 -2 72 -2C64 -2 58 4 58 12C58 24 72 34 72 34Z"/>
      <circle cx="72" cy="12" r="8" class="soft"/>
      <circle cx="72" cy="12" r="3.5" class="tile"/>
      <text class="micro" x="118" y="17">28px / 40px</text>
    </g>
  </g>

  <!-- 5. Bowl Check -->
  <g transform="translate(1110 138)">
    <rect class="card" width="240" height="318" rx="26"/>
    <rect class="tile" x="45" y="30" width="150" height="150" rx="34"/>
    <path class="soft" d="M70 101H170C165 143 145 165 120 165C95 165 75 143 70 101Z"/>
    <path class="green" d="M82 93H158C166 93 172 99 172 107C172 115 166 121 158 121H82C74 121 68 115 68 107C68 99 74 93 82 93Z"/>
    <path d="M94 119L112 137L149 98" stroke="#1f2933" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="120" y="226">Bowl Check</text>
    <text class="caption" x="120" y="254">good order found</text>
    <g transform="translate(57 278)">
      <rect class="tile" width="28" height="28" rx="7"/>
      <path class="soft" d="M5 12H23C22 22 18 26 14 26C10 26 6 22 5 12Z"/>
      <rect class="green" x="4" y="10" width="20" height="6" rx="3"/>
      <path d="M9 15L13 19L20 11" stroke="#1f2933" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="tile" x="52" y="-6" width="40" height="40" rx="9"/>
      <path class="soft" d="M59 12H85C83.5 27 78 34 72 34C66 34 60.5 27 59 12Z"/>
      <rect class="green" x="58" y="9" width="28" height="8" rx="4"/>
      <path d="M65 16L70 21L80 10" stroke="#1f2933" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="micro" x="118" y="17">28px / 40px</text>
    </g>
  </g>

  <g transform="translate(125 555)">
    <rect width="1150" height="250" rx="28" fill="#ffffff" stroke="#dce3e8" stroke-width="2"/>
    <text x="575" y="55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900" fill="#1f2933">Quick Read</text>
    <text x="80" y="105" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#1f2933">1. Plate Check</text>
    <text x="80" y="135" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">Clearest universal signal. Best favicon.</text>
    <text x="80" y="180" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#1f2933">2. Fork Shield</text>
    <text x="80" y="210" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">Strongest dietary-restriction meaning.</text>
    <text x="425" y="105" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#1f2933">3. Scan Plate</text>
    <text x="425" y="135" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">Best match for menu scanning.</text>
    <text x="425" y="180" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#1f2933">4. Pin Plate</text>
    <text x="425" y="210" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">Good if restaurant discovery is central.</text>
    <text x="790" y="105" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#1f2933">5. Bowl Check</text>
    <text x="790" y="135" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">Friendly and food-first, still simple.</text>
