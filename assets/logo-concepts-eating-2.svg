      <path class="two" d="M106 4C112 -2 123 -3 130 4C136 11 132 18 124 22C118 25 115 28 114 31H133V36H103C104 27 108 22 116 19C124 16 127 11 124 7C120 3 112 3 109 8C108 10 107 13 107 16H101C101 11 103 7 106 4Z"/>
