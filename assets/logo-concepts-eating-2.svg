<svg width="1500" height="980" viewBox="0 0 1500 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Eating 2 logo concepts for What 2 Eat</title>
  <desc id="desc">Five clean logo icon concepts where the number 2 becomes a profile eating food, tied to the What 2 Eat name.</desc>
  <rect width="1500" height="980" fill="#FBFAF6"/>
  <style>
    .card { fill: #fff; stroke: #dce3e8; stroke-width: 2; }
    .bg { fill: #1f2933; }
    .two { fill: #d9f5df; }
    .green { fill: #20a464; }
    .ink { fill: #1f2933; }
    .white { fill: #fff; }
    .label { font: 900 28px Inter, Arial, sans-serif; fill: #1f2933; text-anchor: middle; }
    .note { font: 650 17px Inter, Arial, sans-serif; fill: #65717f; text-anchor: middle; }
    .tiny { font: 800 12px Inter, Arial, sans-serif; fill: #65717f; text-anchor: middle; }
  </style>

  <text x="750" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="950" fill="#1f2933">“Eating 2” Logo Directions</text>
  <text x="750" y="91" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" fill="#65717f">The number 2 becomes a simple profile taking a bite. Kept bold so it still works as an app icon.</text>

  <!-- 1. Bite 2 -->
  <g transform="translate(76 135)">
    <rect class="card" width="250" height="360" rx="28"/>
    <rect class="bg" x="50" y="34" width="150" height="150" rx="34"/>
    <path class="two" d="M84 75C103 54 142 51 164 74C182 93 174 119 151 129L126 140C110 147 102 154 99 164H170V181H73C75 152 88 135 113 124L142 111C157 104 162 91 153 81C140 66 111 66 99 82C94 89 91 97 90 106H70C71 94 75 83 84 75Z"/>
    <circle class="green" cx="171" cy="112" r="14"/>
    <path class="ink" d="M151 104C160 104 168 108 172 115C167 121 158 124 149 122L135 119L149 116C157 114 162 112 164 109C161 107 156 106 151 106V104Z"/>
    <text class="label" x="125" y="230">Bite 2</text>
    <text class="note" x="125" y="260">cleanest eating read</text>
    <g transform="translate(57 295)">
      <rect class="bg" width="24" height="24" rx="6"/>
      <path class="two" d="M6 7C9 3 16 3 19 7C22 11 19 15 14 17C11 18 9 19 9 21H20V23H5C5 18 8 15 13 13C17 12 18 9 17 7C15 5 10 5 8 8C7 9 7 11 7 12H4C4 10 5 8 6 7Z"/>
      <circle class="green" cx="20" cy="13" r="2.3"/>
      <rect class="bg" x="44" y="-4" width="32" height="32" rx="8"/>
      <path class="two" d="M51 6C56 1 64 0 69 6C74 11 71 16 64 19C59 21 57 23 56 26H72V29H49C50 22 53 18 59 16C65 13 68 10 65 7C62 4 56 4 54 8C53 10 52 12 52 14H48C48 11 49 8 51 6Z"/>
      <circle class="green" cx="72" cy="14" r="3"/>
      <rect class="bg" x="96" y="-8" width="40" height="40" rx="9"/>
      <path class="two" d="M106 4C112 -2 123 -3 130 4C136 11 132 18 124 22C118 25 115 28 114 31H133V36H103C104 27 108 22 116 19C124 16 127 11 124 7C120 3 112 3 109 8C108 10 107 13 107 16H101C101 11 103 7 106 4Z"/>
      <circle class="green" cx="133" cy="16" r="3.8"/>
      <text class="tiny" x="72" y="50">24 / 32 / 40px</text>
    </g>
  </g>

