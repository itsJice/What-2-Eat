  <g transform="translate(100 580)">
    <rect class="card" width="1300" height="280" rx="30"/>
    <text x="650" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="950" fill="#1f2933">The Right Move</text>
    <text x="80" y="112" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" fill="#1f2933">Why this works</text>
    <text x="80" y="142" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">It makes the name itself memorable: the 2 is not just a number, it is the eater.</text>
    <text x="80" y="192" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" fill="#1f2933">What to avoid</text>
    <text x="80" y="222" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">Do not add a full person, hand, burger, or detailed face. The silhouette should stay icon-simple.</text>
    <text x="820" y="112" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="850" fill="#1f2933">Best direction</text>
    <text x="820" y="150" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="950" fill="#20a464">Bite 2</text>
    <text x="820" y="188" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">It is the simplest read: a 2, a mouth-like bite, and food.</text>
    <text x="820" y="218" font-family="Inter, Arial, sans-serif" font-size="18" fill="#65717f">That is enough for the name and function to click.</text>
  </g>
</svg>
