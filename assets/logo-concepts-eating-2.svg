      <path class="two" d="M52 5C57 0 65 0 70 6C75 11 72 16 65 20L58 25H73V29H49C50 22 53 18 60 15C65 12 67 9 65 7C62 4 56 4 54 8C53 10 52 12 52 14H48C48 10 50 7 52 5Z"/>
      <circle class="ink" cx="61" cy="9" r="1.7"/>
      <circle class="green" cx="76" cy="15" r="2.8"/>
      <rect class="bg" x="96" y="-8" width="40" height="40" rx="9"/>
      <path class="two" d="M107 3C113 -2 124 -2 130 4C136 11 133 18 125 23L115 31H133V36H103C104 27 108 22 117 18C124 14 126 10 123 7C120 3 113 3 109 8C108 10 107 13 107 16H101C101 11 103 6 107 3Z"/>
