    <text class="note" x="125" y="260">most character-like</text>
    <g transform="translate(57 295)">
      <rect class="bg" width="24" height="24" rx="6"/>
      <path class="two" d="M7 6C10 3 17 3 20 7C23 11 20 15 15 17L11 20H21V23H5C6 18 8 15 13 13C17 11 18 9 17 7C15 5 10 5 8 8C7 9 7 11 7 12H4C4 9 5 7 7 6Z"/>
