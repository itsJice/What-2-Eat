  <!-- 5. Face 2 -->
  <g transform="translate(1172 135)">
    <rect class="card" width="250" height="360" rx="28"/>
    <rect class="bg" x="50" y="34" width="150" height="150" rx="34"/>
    <path class="two" d="M86 69C105 51 144 50 165 73C181 91 177 115 156 128L129 145C115 154 107 161 104 169H174V184H77C79 156 91 139 115 124L143 107C156 99 159 87 150 78C137 65 112 65 99 80C94 86 92 94 92 104H72C72 90 77 77 86 69Z"/>
