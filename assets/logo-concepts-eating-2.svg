      <rect class="bg" width="24" height="24" rx="6"/>
      <path class="two" d="M6 7C9 3 16 3 19 7C22 11 19 15 14 17C11 18 9 19 9 21H20V23H5C5 18 8 15 13 13C17 12 18 9 17 7C15 5 10 5 8 8C7 9 7 11 7 12H4C4 10 5 8 6 7Z"/>
