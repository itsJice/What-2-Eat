<svg width="1200" height="820" viewBox="0 0 1200 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">What 2 Eat logo concepts</title>
  <desc id="desc">Five clean app icon logo directions for What 2 Eat: fork check, plate check, monogram bowl, scan frame, and map pin fork.</desc>
  <rect width="1200" height="820" fill="#FBFAF6"/>
  <style>
    .label { font: 800 28px Inter, Arial, sans-serif; fill: #1f2933; text-anchor: middle; }
